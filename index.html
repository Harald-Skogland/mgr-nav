<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visma Manager</title>
<link rel="stylesheet" href="_ds/gaia-design-system-d69b3cc0-3516-47f6-8310-b21a7cf2d901/styles.css">
<style>
  /* =========================================================================
     Shell.

     The device frame lives here and nowhere else. Screens load into the view
     below as ordinary documents with no chrome of their own, so moving between
     the start screen and the app never re-renders the frame — it stays put, at
     a fixed position, with no visual reload.

     Links inside the view target the view by default, so navigation happens
     within the iframe and this document is never replaced.
     ========================================================================= */
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #e7eaee;
    font-family: var(--ga-font-family-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
  }

  /* Matches the AndroidDevice component the app screens were built inside. */
  .device {
    width: 412px;
    height: 892px;
    flex-shrink: 0;
    box-sizing: border-box;
    border: 8px solid rgba(116, 119, 117, .5);
    border-radius: 18px;
    overflow: hidden;
    background: #f4fbf8;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .25);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .statusbar {
    height: 40px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    position: relative;
    color: #171d1b;
    font-family: Roboto, system-ui, sans-serif;
    font-size: 14px;
    letter-spacing: .25px;
    background: #f4fbf8;
  }
  .statusbar__punch {
    position: absolute; left: 50%; top: 8px; transform: translateX(-50%);
    width: 24px; height: 24px; border-radius: 100px; background: #2e2e2e;
  }
  .statusbar__levels { display: flex; align-items: center; gap: 3px; }

  .device__view {
    flex: 1;
    min-height: 0;
    width: 100%;
    border: 0;
    display: block;
    background: var(--ga-color-surface-page);
  }

  .navbar {
    height: 24px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4fbf8;
  }
  .navbar__pill {
    width: 108px; height: 4px; border-radius: 2px;
    background: #171d1b; opacity: .4;
  }

  /* On a handset the browser and OS supply the real chrome. */
  @media (max-width: 480px) {
    body { display: block; background: var(--ga-color-surface-page); }
    .device {
      width: 100%; height: 100dvh;
      border: 0; border-radius: 0; box-shadow: none;
    }
    .statusbar, .navbar { display: none; }
  }
</style>
</head>
<body>

<div class="device">

  <div class="statusbar" aria-hidden="true">
    <span>9:30</span>
    <span class="statusbar__punch"></span>
    <span class="statusbar__levels">
      <svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 13.3L.67 5.97a10.37 10.37 0 0114.66 0L8 13.3z" fill="currentColor"/></svg>
      <svg width="16" height="16" viewBox="0 0 16 16"><path d="M14.67 14.67V1.33L1.33 14.67h13.34z" fill="currentColor"/></svg>
      <svg width="16" height="16" viewBox="0 0 16 16"><rect x="4" y="1.5" width="8" height="13" rx="2" fill="currentColor"/></svg>
    </span>
  </div>

  <iframe class="device__view" id="view" title="Visma Manager"></iframe>

  <div class="navbar" aria-hidden="true"><span class="navbar__pill"></span></div>

</div>

<script>
(function () {
  'use strict';
  // /            -> the start screen
  // /?open=<key> -> straight into the app, so existing deep links still work.
  var key = '';
  try { key = new URLSearchParams(window.location.search).get('open') || ''; } catch (e) {}
  document.getElementById('view').src =
    key ? 'app.html?open=' + encodeURIComponent(key) : 'start.html';
}());
</script>

</body>
</html>
